[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "apolo-roblox-mcp-server"
version = "0.1.0"
description = "GitHub-native, Studio-independent Roblox game development MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
apolo-roblox-mcp = "apolo_roblox_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apolo_roblox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
